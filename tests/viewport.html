<!doctype html><meta charset="utf-8"><title>Viewport QA</title><style>body{margin:0;background:#ddd}iframe{border:0;transform-origin:top left;display:block}</style><iframe title="Game viewport preview" src="/"></iframe><script>const q=new URLSearchParams(location.search),w=Number(q.get('w')||1280),h=Number(q.get('h')||900),f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+Math.min(1,innerWidth/w)+')';f.onload=()=>{const d=f.contentDocument,out=document.createElement('p');out.style.cssText='position:fixed;bottom:0;background:white;padding:8px;font:12px monospace';out.textContent='Viewport '+d.documentElement.clientWidth+' / content '+d.documentElement.scrollWidth+' / canvas '+d.querySelectorAll('canvas').length;document.body.append(out);};</script>
